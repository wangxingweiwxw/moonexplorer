<body>
<main id="app">
  <div id="stage">
    <canvas id="view" width="960" height="540" aria-label="月球探险家"></canvas>
    <section id="boot" class="screen"><div>正在装载摇篮基地数据包…</div><div class="bar"><i id="bootBar"></i></div></section>
    <section id="start" class="screen hidden">
      <div class="gate">
        <div class="gate-panel" id="gate2d">
          <img id="coverArt" alt="2D 像素封面：月面基地与探险者" src="./assets/cover.jpg">
          <button type="button" id="enter2d" class="gate-click" aria-label="进入 2D 像素探险"></button>
          <a href="./pinball.html" id="enterPinball" class="base-hotspot" aria-label="进入月球基地弹珠台">
            <span class="hotspot-glow"></span>
          </a>
          <span class="gate-label">
            <span class="gate-mode">PIXEL 2D</span>
            <span class="gate-title">像素探险</span>
            <span class="gate-actions">
              <span class="gate-hint">点击进入</span>
              <a href="./pinball.html" class="gate-sub" id="enterPinballChip">弹珠台</a>
            </span>
          </span>
        </div>
        <div class="gate-panel" id="gate3d">
          <img id="preview3d" alt="3D 体素预览：宇航员、北极狐与月球车" src="./assets/preview-3d.png">
          <a href="./play3d.html?play=1" id="enter3d" class="gate-click" aria-label="进入 3D 体素探险"></a>
          <a href="./rover.html" id="enterRover" class="rover-hotspot" aria-label="进入月球车探险">
            <span class="hotspot-glow"></span>
          </a>
          <span class="gate-label">
            <span class="gate-mode">WEBGL 3D</span>
            <span class="gate-title">体素巡检</span>
            <span class="gate-actions">
              <span class="gate-hint">点击进入</span>
              <a href="./rover.html" class="gate-sub" id="enterRoverChip">月球车</a>
              <a href="./roam.html" class="gate-sub" id="enterRoamChip">全月漫游</a>
            </span>
          </span>
        </div>
      </div>
      <header class="gate-bar">
        <div class="gate-brand">
          <div class="eyebrow">CRADLE BASE / OFFLINE</div>
          <h1 class="title">月球探险家</h1>
        </div>
        <div class="buttons">
          <button type="button" id="mapStartBtn" class="small">航线</button>
          <button type="button" id="codexStartBtn" class="small">图鉴</button>
          <button type="button" id="briefStartBtn" class="small">简介</button>
          <button type="button" id="settingsStartBtn" class="small">设置</button>
        </div>
      </header>
    </section>
    <section id="game" class="hidden">
      <div class="hud">
        <div class="topbar">
          <div class="chip"><strong id="sceneName">月面荒野</strong><br><span id="sceneSub">SURFACE / 01</span></div>
          <div class="chip oxygen">氧气 <strong id="oxygenText">100%</strong><div class="oxygenbar"><i id="oxygenBar"></i></div></div>
          <div class="chip chip-extra">档案 <strong id="count">0/18</strong><br><span id="statusLine">探索中</span></div>
          <div class="chip">得分 <strong id="score">000000</strong><br><span id="crystalText">晶体 0</span></div>
          <div class="chip chip-extra">连击 <strong id="comboText">x1</strong><br><span id="abilityText">能力未解锁</span></div>
          <div class="top-actions">
            <button type="button" class="small" id="mapBtn">航线</button>
            <button type="button" class="small" id="codexBtn">图鉴</button>
            <button type="button" class="small" id="pauseBtn">菜单</button>
          </div>
        </div>
        <div class="mission"><b>当前任务</b><br><span id="missionText">跟随北极狐，扫描月面档案并校准第一台设备。</span></div>
        <div id="talk" class="talk hidden"></div>
        <div id="toast"></div>
      </div>
    </section>
  </div>
  <div id="pad" class="pad hidden" aria-label="触摸操作">
    <div class="pad-col">
      <button type="button" class="pad-btn" data-hold="a">←</button>
      <button type="button" class="pad-btn" data-hold="d">→</button>
    </div>
    <div class="pad-col">
      <button type="button" class="pad-btn" id="padAct">互动</button>
      <button type="button" class="pad-btn" id="padShot">射线</button>
    </div>
    <div class="pad-col pad-stack">
      <button type="button" class="pad-btn" data-hold="Shift">喷气</button>
      <button type="button" class="pad-btn primary jump" data-hold=" ">跳</button>
    </div>
  </div>
  <section id="modal" class="screen modal-back hidden"><div class="modal" id="modalBody"></div></section>
</main>
